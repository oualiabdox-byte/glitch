services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: glitch-hindsight
    restart: unless-stopped
    shm_size: 1g
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      HINDSIGHT_API_LLM_PROVIDER: openrouter
      HINDSIGHT_API_LLM_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in the shell}
      HINDSIGHT_API_LLM_MODEL: openrouter/free
    volumes:
      - hindsight-data:/home/hindsight/.pg0

volumes:
  hindsight-data:
