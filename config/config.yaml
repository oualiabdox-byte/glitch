# Forex bot configuration (YAML)
pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCHF
  - USDCAD
  - AUDUSD
  - NZDUSD

risk:
  risk_per_trade_pct: 0.005
  max_open_per_pair: 1
  max_correlated_usd_exposure: 3
  max_daily_loss_r: 3.0
  max_open_positions: 3
  max_risk_per_trade_r: 0.02
  max_quote_age_seconds: 60

sessions:
  london:
    timezone: Europe/London
    open: "08:00"
    close: "17:00"
  new_york:
    timezone: America/New_York
    open: "08:00"
    close: "17:00"

execution:
  allow_overnight: false
  live_trading: false
  max_spread_pips: 3.0
  spread_pips: 1.5
  commission_per_lot_round_turn: 0.0
  slippage_pips: 0.0
  allow_fixed_rr_fallback: true  # breakout_retest only; structure_entry remains strict

backtest:
  look_ahead_guard: true
  mode: strict_ict_smc
  intrabar_policy: sl_first
  data_prices: mid
  require_closed_bars: true

# Extended model layered above the existing strategy; execution is unchanged.
ict_mtf:
  model: strict_d1_h1_poi_m5_confirmation
  allow_weak_daily: false
  weak_daily_risk_multiplier: 0.50
  h1_swing_length: 5
  h1_fvg_min_atr: 0.10
  h1_liquidity_lookback: 24
  h1_poi_max_age: 48
  h1_poi_tolerance_atr: 0.25
  m5_swing_length: 3
  m5_sweep_lookback: 18
  m5_sweep_buffer_atr: 0.10
  m5_bos_buffer_atr: 0.10
  m5_displacement_body_atr: 0.75
  m5_displacement_body_range: 0.50
  m5_two_bar_displacement_atr: 1.00
  fib_equilibrium: 0.50
  fib_ote_low: 0.618
  fib_ote_high: 0.786
  entry_expiry_bars: 8
  m5_fvg_min_atr: 0.05
  require_m5_confluence: false

# Side-by-side research model: external liquidity validates the H1 range/Fib.
irl_erl_retest:
  model: irl_erl_retest
  h1_swing_length: 5
  h1_fvg_min_atr: 0.10
  h1_external_lookback: 72
  h1_sweep_buffer_atr: 0.10
  h1_retest_max_bars: 24
  fib_half: 0.50
  m5_swing_length: 3
  m5_confirmation_lookback: 36
  m5_break_buffer_atr: 0.10
  m5_displacement_body_atr: 0.75
  m5_displacement_body_range: 0.50
  m5_two_bar_displacement_atr: 1.00
  m5_poi_min_atr: 0.05
  target_rr: 1.50
  allow_weak_daily: false
