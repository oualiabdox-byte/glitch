# Forex bot configuration
pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCHF
  - USDCAD
  - AUDUSD
  - NZDUSD

risk:
  risk_per_trade_pct: 0.005
  max_open_per_pair: 1
  max_correlated_usd_exposure: 3
  max_daily_loss_r: 3.0
  max_open_positions: 3
  max_risk_per_trade_r: 0.02
  max_quote_age_seconds: 60

sessions:
  london:
    timezone: Europe/London
    open: "08:00"
    close: "17:00"
  new_york:
    timezone: America/New_York
    open: "08:00"
    close: "17:00"

execution:
  allow_overnight: false
  live_trading: false
  max_spread_pips: 3.0
  spread_pips: 1.5
  commission_per_lot_round_turn: 0.0

backtest:
  look_ahead_guard: true
  mode: h1_location_m5_execution
  intrabar_policy: sl_first
  data_prices: mid
  require_closed_bars: true

strategy:
  context_timeframe: H1
  execution_timeframe: M5
  swing_length: 2
  min_rr: 0.0
  stop_buffer: 0.0
  allow_weak_structure: true
  allow_equilibrium_overlapping_fvg: true
  setup_max_age_hours: 72
  m5_confirmation_mode: CHOCH_OR_BOS
  svl:
    require_alignment: false
    profile_bins: 24
    equal_tolerance_pct: 0.001
