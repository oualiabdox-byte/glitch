# Forex bot configuration (YAML)
pairs:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCHF
  - USDCAD
  - AUDUSD
  - NZDUSD

risk:
  risk_per_trade_pct: 0.005
  max_open_per_pair: 1
  max_correlated_usd_exposure: 3

sessions_utc:
  london: [7, 12]
  new_york: [13, 17]

execution:
  allow_overnight: false
  live_trading: false

backtest:
  look_ahead_guard: true
  default_mode: hybrid
