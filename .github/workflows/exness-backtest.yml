name: Exness Forex Backtest

concurrency:
  group: forex-bot-exness
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date"
        required: true
        default: "2025-01-01T00:00:00Z"
      end:
        description: "UTC end date"
        required: true
        default: "2026-01-01T00:00:00Z"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD, NZDUSD]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Exness backtest
        env:
          START: ${{ github.event.inputs.start || '2025-01-01T00:00:00Z' }}
          END: ${{ github.event.inputs.end || '2026-01-01T00:00:00Z' }}
        run: |
          mkdir -p results
          python -m backtest.exness_runner \
            --symbol "${{ matrix.symbol }}" \
            --start "$START" \
            --end "$END" \
            --csv "results/${{ matrix.symbol }}.csv" \
            --json "results/${{ matrix.symbol }}.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exness-backtest-${{ matrix.symbol }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
