name: SMC Regression Tests

on:
  push:
    branches: [main, clean-forex-engine]
  pull_request:
    branches: [main]

concurrency:
  group: forex-bot-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
