name: SMC Regression Tests

concurrency:
  group: forex-bot-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -U pytest
      - run: pytest -q tests/test_smc_calibration.py
