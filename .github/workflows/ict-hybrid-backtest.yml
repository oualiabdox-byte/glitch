name: ICT Hybrid Forex Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forex-bot-ict
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD]
        mode: [hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run B2TRADER backtest
        run: |
          mkdir -p results
          python -m backtest.b2trader_runner --symbol "${{ matrix.symbol }}" --market-symbol "cfd.${{ matrix.symbol }}" --mode "${{ matrix.mode }}" --start "2025-01-01T00:00:00Z" --end "2026-01-01T00:00:00Z" --base-url "$B2TRADER_BASE_URL" --json "results/${{ matrix.mode }}_${{ matrix.symbol }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ict-${{ matrix.mode }}-${{ matrix.symbol }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
