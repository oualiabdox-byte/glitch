name: cTrader ICT Hybrid Forex Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start
        required: true
        default: "2025-01-01T00:00:00Z"
      end:
        description: UTC end
        required: true
        default: "2026-01-01T00:00:00Z"

concurrency:
  group: ctrader-forex-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        symbol: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, NZDUSD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run cTrader backtest
        env:
          CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
          CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
          CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
          CTRADER_ENV: demo
          CTRADER_ALLOW_ORDERS: "false"
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          test -n "$CTRADER_CLIENT_ID"
          test -n "$CTRADER_CLIENT_SECRET"
          test -n "$CTRADER_ACCESS_TOKEN"
          mkdir -p results
          python -m backtest.ctrader_runner --symbol "${{ matrix.symbol }}" --mode hybrid --start "$START" --end "$END" --json "results/hybrid_${{ matrix.symbol }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ict-hybrid-${{ matrix.symbol }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
