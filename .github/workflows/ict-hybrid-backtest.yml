name: ICT Hybrid Forex Backtest

concurrency:
  group: forex-bot-${{ github.workflow }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        symbol: [EURUSD,GBPUSD,USDJPY,USDCHF,AUDUSD,USDCAD,NZDUSD]
        mode: [strict,hybrid]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Exness backtest
        run: |
          mkdir -p results
          python -m backtest.exness_runner --symbol "${{ matrix.symbol }}" --mode "${{ matrix.mode }}" --start "2025-01-01T00:00:00Z" --end "2026-01-01T00:00:00Z" --csv "results/${{ matrix.mode }}_${{ matrix.symbol }}.csv" --json "results/${{ matrix.mode }}_${{ matrix.symbol }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ict-${{ matrix.mode }}-${{ matrix.symbol }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
